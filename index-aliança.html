<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> I Love You </title>
    <link rel="stylesheet" href="style-aliança.css">
</head>
<body>
    <div class="caixa">

    </div>
    <footer>
        <p>© 2026 I Love You. Forever.</p>
    </footer>
        <canvas id="fireworks"> </canvas>
    <script>
        
const canvas = document.getElementById('fireworks');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

class Particle {
  constructor(x, y, color, velocity) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.velocity = velocity;
    this.alpha = 1;
    this.friction = 0.98;
    this.gravity = 0.02;
  }
  update() {
    this.velocity.x *= this.friction;
    this.velocity.y *= this.friction;
    this.velocity.y += this.gravity;
    this.x += this.velocity.x;
    this.y += this.velocity.y;
    this.alpha -= 0.01;
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.fill();
    ctx.restore();
  }
}

let particles = [];

function createFirework(x, y) {
  const colors = ['#fa2020', '#fd3838', '#fa2020', '#fd3838', '#fa2020'];
  const particleCount = 50;
  for (let i = 0; i < particleCount; i++) {
    const angle = (Math.PI * 2) / particleCount * i;
    const speed = Math.random() * 4 + 2;
    particles.push(new Particle(
      x, y,
      colors[Math.floor(Math.random() * colors.length)],
      { x: Math.cos(angle) * speed, y: Math.sin(angle) * speed }
    ));
  }
}

function animate() {
  requestAnimationFrame(animate);
  ctx.fillStyle = 'rgba(23, 1, 1, 0.2)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  particles.forEach((p, i) => {
    if (p.alpha <= 0) {
      particles.splice(i, 1);
    } else {
      p.update();
      p.draw();
    }
  });
}

// Lista de posições fixas para os fogos
const fireworkPositions = [
  { x: canvas.width * 0.25, y: canvas.height * 0.4 },
  { x: canvas.width * 0.5,  y: canvas.height * 0.3 },
  { x: canvas.width * 0.75, y: canvas.height * 0.45 }
];

// Criar fogos automaticamente em intervalos
setInterval(() => {
  fireworkPositions.forEach(pos => {
    createFirework(pos.x, pos.y);
  });
}, 800); // a cada 0.8 segundos

animate();

    </script>
</body>
</html>
